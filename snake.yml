# Generate Snake Animation

This GitHub Actions workflow generates a snake animation SVG and publishes it to the `output` branch of the repository. The SVG is created using [Platane/snk/svg-only](https://github.com/Platane/snk) and deployed using [crazy-max/ghaction-github-pages](https://github.com/crazy-max/ghaction-github-pages).

## Workflow Triggers

The workflow is configured to run under the following conditions:

- **Scheduled:** Automatically every 12 hours using a cron expression.
- **Manual Trigger:** Via GitHub’s `workflow_dispatch` (on-demand execution).
- **Push Trigger:** When changes are pushed to the `main` branch.

## Workflow File

Below is the complete YAML configuration:

```yaml
name: Generate snake animation

on:
  schedule: # Execute every 12 hours
    - cron: "* */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: dist/snake.svg?palette=github-dark

      - name: push snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
